<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Follow</title>
    <style>
        .box {
            height: 100px;
            width: 100px;
            border-radius: 50%;
            position: absolute;
            background-color: rebeccapurple;
            pointer-events: none; /* Make sure it doesn't block mouse events */
        }
    </style>
</head>
<body>

    <div class="box"></div>
   
    <script>
        const box = document.querySelector('.box');
        
        document.addEventListener('mousemove', (e) => {
            // Set the position of the .box element based on cursor position
            box.style.left = `${e.pageX - 50}px`;  // -50 to center the box on the cursor
            box.style.top = `${e.pageY - 50}px`;   // -50 to center the box on the cursor
        });
    </script>

</body>
</html>
